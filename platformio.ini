; =============================================================================
; PlatformIO Configuration — Billy Bass AI Animatronic Fish
; Target: ESP32-WROOM-32D (No PSRAM) — Arduino Framework
; =============================================================================

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino

; --- Build Flags -----------------------------------------------------------
; -DBOARD_HAS_PSRAM=0        : Explicit no-PSRAM guard
; -DCORE_DEBUG_LEVEL=3        : Warn-level logging (0=None,5=Verbose)
; -DCONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST=0
; -DARDUINO_EVENT_RUNNING_CORE=0 : WiFi events on Core 0
; -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
build_flags =
    -DBOARD_HAS_PSRAM=0
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DARDUINO_EVENT_RUNNING_CORE=0
    -std=gnu++17
    -O2

build_unflags = -std=gnu++11

; --- Serial Monitor --------------------------------------------------------
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; --- Partition Table -------------------------------------------------------
; Firmware exceeds ~1.9MB limit of min_spiffs.csv.
; "huge_app.csv" gives ~3MB app partition (no OTA, 64KB SPIFFS).
board_build.partitions = huge_app.csv

; --- Library Dependencies --------------------------------------------------
lib_deps =
    ; Async Web Server (captive portal + settings panel)
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git

    ; Bluetooth A2DP Sink — Phil Schatzmann's battle-tested library
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.3

    ; Arduino Audio Tools — I2S abstraction, streams, converters
    https://github.com/pschatzmann/arduino-audio-tools.git#v1.0.2

    ; WebSockets client for AI Agent mode
    links2004/WebSockets@^2.6.1

    ; JSON for config/API payloads
    bblanchon/ArduinoJson@^7.3.0

    ; Preferences (built-in, but declaring for clarity)
    ; Already part of esp32 Arduino core — no external dep needed

; --- Upload ----------------------------------------------------------------
upload_speed = 921600
